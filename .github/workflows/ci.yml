name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt && pip install -e .
      - name: Retrain pipeline from scratch (checks reproducibility)
        run: python -m churn.pipeline
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t churn-optimizer .
      - name: Smoke-test container
        run: |
          docker run -d -p 8000:8000 --name api churn-optimizer
          for i in $(seq 1 60); do curl -sf localhost:8000/health && break; sleep 2; done
          docker logs api
          curl -sf -X POST localhost:8000/predict -H "Content-Type: application/json" -d '{}'
          curl -sf localhost:8000/ | grep -q ChurnOpt
          curl -sf "localhost:8000/api/summary" > /dev/null
